# Pre-commit hooks for the PMS monorepo.
#
# Install once per dev box:
#   pip install pre-commit
#   pre-commit install
#
# Then every `git commit` runs the hooks below. Bypass intentionally
# with `git commit --no-verify` only when you know exactly why.
#
# We keep linters in *advisory* mode (warn, don't fail) initially while
# the existing 100k-line codebase is being cleaned up. Flip
# `continue-on-error` / fail_fast once the baseline is clean.

minimum_pre_commit_version: '3.5.0'

repos:
  # ── Catch generic mistakes ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$|\.snap$'
      - id: end-of-file-fixer
        exclude: '\.svg$|\.snap$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: '^frontend/(node_modules|dist)/|tsconfig.*\.json$'
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # ── Secret scanning — non-negotiable ───────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Gitleaks scans staged content for credentials. A finding fails
        # the commit; if it's a false positive, exclude in .gitleaks.toml
        # rather than disabling the hook.

  # ── Python: ruff (lint + format) ───────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: '^backend/'
        args: [--fix, --exit-zero]   # warn; don't block during baseline cleanup
      - id: ruff-format
        files: '^backend/'

  # ── Python: docstring + obvious bugs ───────────────────────────────
  # bandit / pyflakes are part of ruff's rule set above (S, F).

  # ── Frontend: prettier + eslint ────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: '^frontend/.*\.(ts|tsx|js|jsx|json|css|md|yaml|yml)$'
        exclude: '^frontend/(dist|node_modules|coverage)/'

  # ── Local hooks (use the package's own toolchain) ──────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: bash -c 'cd frontend && npm run lint -- --max-warnings=200'
        files: '^frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false
