<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assisi Social</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px; height: 300px;
      background: #111827;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .icon {
      width: 64px; height: 64px;
      background: #3B82F6;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }

    .icon svg { width: 36px; height: 36px; fill: #fff; }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #9CA3AF;
      margin-bottom: 32px;
    }

    .status {
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 12px;
    }

    .dots {
      display: flex; gap: 8px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #3B82F6;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1.0; }
    }
  </style>
</head>
<body>
  <div class="icon">
    <!-- Hotel building SVG icon -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 22V8l11-6 11 6v14H1zm2-2h18V9.25L12 4 3 9.25V20zm4-3h2v-3H9v3zm4 0h2v-3h-2v3zm4 0h2v-3h-2v3zM9 13h2v-3H9v3zm4 0h2v-3h-2v3zm4 0h2v-3h-2v3z"/>
    </svg>
  </div>
  <h1>Assisi Social</h1>
  <p class="subtitle">Assisi Social Desktop App</p>
  <p class="status">Starting services...</p>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
