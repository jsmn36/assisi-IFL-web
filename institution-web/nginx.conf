# nginx config for the static SPA.
#
# - Long-cache hashed asset bundles (vite emits content-hashed names).
# - HTML never cached so deploys roll out instantly.
# - SPA fallback (try_files ... /index.html) so client-side routing works.
# - Sensible security headers (CSP is *not* set here — the backend's
#   SecurityHeadersMiddleware sets it on API responses; for the SPA shell
#   the strict CSP would block inline scripts injected by Vite for HMR /
#   bundle integrity. Tune to taste once you've audited the bundle.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles: cache aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # HTML never cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensible defaults
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(self), usb=()" always;

    # Hide nginx version
    server_tokens off;

    # Health endpoint (used by container orchestrators)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
