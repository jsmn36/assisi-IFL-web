# Python tool config for the backend. We don't use a build backend here
# (the project is run as a service, not packaged as a wheel) — this file
# only carries lint/format/type-check settings.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "alembic/versions",  # generated; not worth bikeshedding migration style
  "venv",
  ".venv",
  "htmlcov",
  "tests/data",
]

[tool.ruff.lint]
# Start with a tame baseline. Add rules incrementally as the codebase
# is cleaned up.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear (likely-bugs)
  "S",    # bandit (security)
  "UP",   # pyupgrade (modernizations)
  "RUF",  # ruff-specific
]
ignore = [
  "E501",   # line-length (we run with 100 but keep this ignored to avoid noisy reflows)
  "B008",   # function calls in default args (FastAPI Depends pattern)
  "S101",   # assert (used heavily in tests)
  "S311",   # non-cryptographic random — fine in test data
  "RUF012", # mutable-class-attr — Pydantic/SQLA both rely on these patterns
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed liberties: use of fixtures, fixtures with side effects, etc.
"tests/**/*.py" = ["S105", "S106", "S107", "B017", "F401", "F811"]
# Migrations have a constrained shape that ruff can't fully grok.
"alembic/**/*.py" = ["E", "F", "B"]
# Seed scripts are intentionally noisy (prints, hardcoded data).
"seed_*.py" = ["S", "T"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
exclude = "(alembic/versions|tests|venv|\\.venv)"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "app.payments.stripe_provider"
ignore_errors = true   # stripe SDK types are heavy; revisit when we install it in CI

[[tool.mypy.overrides]]
module = "app.notifications.sms_provider"
ignore_errors = true
